<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />

        <!-- Title of the webpage -->
        <title>Guardians of the Koppie</title>

        <!-- A-Frame core library -->
        <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

        <!-- AR.js libraries for location-based AR -->
        <script
            type="text/javascript"
            src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>

        <script
            type="text/javascript"
            src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

        <!-- A-Frame Extras library -->
        <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>

        <!-- A-Frame component to make an entity look at the camera -->
        <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    </head>
    <body>
        <!-- A-Frame scene for AR content -->
        <a-scene
            vr-mode-ui="enabled: false"
            arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
            renderer="antialias: true; alpha: true">
            <!-- AR Camera with GPS settings -->
            <a-camera gps-new-camera="gpsMinDistance: 10"
                ><a-cursor
                    id="cursor"
                    raycaster="objects: .clickable"
                    material="color: white; shader: flat"
                    geometry="radiusInner: 0.01; radiusOuter: 0.02"
                    fuse="false">
                </a-cursor>
            </a-camera>

            <!-- 3D model entity placed at a specific GPS location -->
            <a-entity
                id="mymodel"
                gltf-model="./Assets/earth-runestone.glb"
                rotation="0 0 0"
                scale="1 1 1"
                gps-new-entity-place="latitude: -26.021973; longitude: 28.030877"
                class="clickable"
                look-at="[gps-new-camera]">
                <!-- "Tap to Start" image prompt -->
                <a-image
                    id="tapToStart"
                    src="./Assets/tap-to-start.svg"
                    position="0 1.5 0"
                    width="1"
                    height="1"
                    look-at="[gps-new-camera]">
                </a-image>
            </a-entity>
        </a-scene>

        <!-- HTML audio element for the guardian's theme music -->
        <audio id="guardianAudio" src="./Assets/earth-guardian-theme.mp3" preload="auto"></audio>

        <script>
            // Get references to the model, tap image, and audio elements
            const model = document.querySelector("#mymodel");
            const tapImage = model.querySelector("#tapToStart");
            const sound = document.querySelector("#guardianAudio");

            // Add a click event listener to the model
            model.addEventListener("click", (e) => {
                // Swap the runestone model with the guardian model
                model.setAttribute("gltf-model", "./Assets/earth-guardian.glb");
                model.setAttribute("scale", "5 5 5");
                model.setAttribute("animation-mixer", "");

                // Hide the "Tap to Start" prompt
                tapImage.setAttribute("visible", "false");

                // Play the guardian's theme music
                sound.play();
            });
        </script>
    </body>
</html>
